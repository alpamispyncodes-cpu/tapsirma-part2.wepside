<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <script>
        let mawsim = prompt("Birewin tanlan(bahar, jaz, guz, qis.)")
        if (mawsim === "bahar"){
            console.log("Nawriz bayrami bar")
        } else if (mawsim === "jaz"){
            console.log("Uraa shomilamiz!")
        } else if (mawsim === "guz"){
            console.log("Jiyim terim baslandi")
        } else if (mawsim === "qis"){
            console.log("Jana jil bayrami bar")
        } else{
            console.log("(bahar, jaz, guz, qis) usilardan birewin tanlan!")
        }
    </script>
</body>
</html>
