<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        h1{
            font-size: 180px;
            font-family: Arial;
            color: lightblue;
        }
        @media (max-width: 700px){
            h1 {
                color: green;
                font-size: 60px
            }
        }
        @media (max-width: 500px){
            h1 {
                font-size: 60px;
                color: red;
            }
        }
        @media (max-width: 300px){
            h1 {
                font-size: 30px;
                border: 2px solid black;
            }
        }
    </style>
</head>
<body>
    <h1>
        Qalay aman saw
    </h1>
</body>
</html>
