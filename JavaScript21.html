<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let valuta = prompt("Sizge kerek valutani tanlan?(dollor, tenge, rubl)")
        let money = Number(prompt(${valuta} bolsa qansha ${valuta} bar))

        if (valuta ==="dollor"){
            dollorToUz(money)
        } else if (valuta ==="tenge"){
            tengeToUz(money)
        } else if (valuta === "rubl"){
            rublToUz(money)
        }   
        function dollorToUz(money){
            console.log("${money} dollor ---> ${12000 *money} som boladi")
        }
        function tengeToUz(money){
            console.log("${money} tenge ---> ${25000 * money} som boladi")
        }
        function rublToUz(money){
            console.log("${money} rubl ---> ${165 * money} som boladi")
        }
    </script>
</body>
</html>
