<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsirma</title>
    <style>
        .box{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            margin-bottom: 20px;
        }
        .box2{
            display: grid;
            grid-template-columns: 70px 210px 70px;
            margin-bottom: 20px;
        }
        .box3{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr
        }
    </style>
</head>
<body>
    <div class="box">
        <div style="background-color: lightcoral;">200px</div>
        <div style="background-color: lightgreen;">200px</div>
        <div style="background-color: lightseagreen;">200px</div>
    </div>

    <div class="box2">
        <div style="background-color: blue;">box1</div>
        <div style="background-color: green;">box2</div>
        <div style="background-color: red;">box3</div>
    </div>

    <div class="box3">
        <div style="background-color: aquamarine;"> box 1</div>
        <div style="background-color: brown;"> box 2</div>
        <div style="background-color: chartreuse;"> box 3</div>
    </div>
</body>
</html>
