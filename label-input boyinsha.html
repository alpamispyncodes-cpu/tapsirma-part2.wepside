<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapsirma</title>
</head>
<body>
    <form>
        <h1>Oziniz haqqinda magliwmat beriw</h1>
        <label for="Atiniz">Atiniz:</label>
        <input type="text" placeholder="Atinizdi kiritin" id="Atiniz" required>
        <br> <br>
        <label for="email">Email:</label>
        <input type="Email" placeholder="email kiritin" required id="email">
        <br> <br>
        <label for="parol">Parol:</label>
        <input type="password" placeholder="Parol kiritin" required id="parol">
        <br> <br>
        <label for="Jinsi">Jinsi</label>
        <input type="radio" name="Jinsi" id="erkek" required>
        <label for="erkek">Erkek</label>
        <input type="radio" name="Jinsi" id="ayel" required>
        <label for="ayel">Ayel</label>
        <br> <br>
        <label for="Xobbiy">Xobbiy:</label>
        <input type="checkbox" id="Shaxmat">
        <label for="Shaxmat">Shaxmat</label>
        <input type="checkbox" id="Kitap">
        <label for="Kitap">Kitap oqiw</label>
        <input type="checkbox" id="Sayaxat">
        <label for="Sayaxat">Sayaxat</label>
        <br>
        <textarea name="30" rows="10" cols="40" placeholder="Oziniz haqqinda toliq..." required></textarea>
        <br>
        <label>Suwret</label>
        <button>Choose File</button>
        <label>No file Chosen</label>
        <br> <br>
        <button>Jiberiw</button>
    </form>
</body>
</html>
