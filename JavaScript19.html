<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>JavaScript</title>
</head>
<body>
        <script>
                function kobeytiw(a, b) { 
                console.log(`${a} * ${b} = ${a * b}`) 
            } 
                function aliw(a, b) { 
                console.log(`${a} - ${b}= ${a - b}`) }
                 
                let a =Number(prompt ("Birinshi sandi kiritin")) 
                let b =Number(prompt ("Ekinshi sandi kiritin")) 
                let operator = prompt("Birewin tanlan(+, -, *)") 
                    if (operator === "*" ) {
                    kobeytiw(a, b) } 
                    else if (operator === "-") { 
                    aliw() } 
        </script>
    </body>
</html>
